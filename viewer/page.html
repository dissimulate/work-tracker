<!doctype html>
<!-- The viewer's page shell. The server fills the double-brace placeholders below (title, slug, version, token, body).
     On a tracker's page, body is main_html() in scripts/tracker/viewer.py, which app.js swaps in place when the tracker
     changes. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-slug="{{slug}}" data-version="{{version}}" data-token="{{token}}">
  <div id="bar">
    <div id="switch" hidden>
      <button id="switch-open" class="icon" type="button" aria-label="Switch tracker" title="Switch tracker"
              aria-expanded="false" aria-controls="switch-list">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5 3 8l9 4.5L21 8l-9-4.5Z"/>
          <path d="m3 12 9 4.5 9-4.5"/>
          <path d="m3 16 9 4.5 9-4.5"/>
        </svg>
      </button>
      <div id="switch-list" hidden>
        <ul data-list="active"></ul>
        <p class="err" role="alert" hidden></p>
        <button id="switch-archived" type="button" aria-expanded="false" aria-controls="switch-archived-list" hidden>
          Archived <span class="n"></span>
        </button>
        <ul id="switch-archived-list" data-list="archived" hidden></ul>
      </div>
      <template id="switch-row">
        <li>
          <a><b></b> <span class="meta"></span><small class="meta" hidden></small></a>
          <button class="icon more" type="button" aria-haspopup="true" aria-expanded="false">⋯</button>
        </li>
      </template>
      <div id="row-menu" hidden>
        <button type="button" data-act="archive">Archive</button>
        <button type="button" data-act="unarchive">Unarchive</button>
        <button type="button" data-act="delete">Delete</button>
      </div>
    </div>
    <div id="live"></div>
    <button id="refresh" type="button" hidden>Refresh</button>
    <button id="theme" class="icon" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/>
      </svg>
    </button>
  </div>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <p id="confirm-title"><b>Delete <span data-title></span>?</b></p>
    <p class="meta">This moves the folder <code data-root></code> to the system's trash, with its tickets, decisions,
      actions, log and evidence. To get it back, restore it from the trash.</p>
    <p class="err" role="alert" hidden></p>
    <div class="actions">
      <button type="button" data-cancel>Cancel</button>
      <button type="button" class="danger" data-delete>Delete</button>
    </div>
  </dialog>
  <main>{{body}}</main>
  <script src="/assets/app.js"></script>
</body>
</html>
