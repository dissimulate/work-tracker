<!doctype html>
<!-- The viewer's page shell. The server fills the double-brace placeholders below (title, slug, version, token, body).
     On a tracker's page, body is main_html() in scripts/tracker/viewer.py, which app.js swaps in place when the tracker
     changes. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-slug="{{slug}}" data-version="{{version}}" data-token="{{token}}">
  <div id="bar">
    <div id="live"></div>
    <button id="refresh" type="button" hidden>Refresh</button>
    <button id="theme" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg>
    </button>
  </div>
  <main>{{body}}</main>
  <script src="/assets/app.js"></script>
</body>
</html>
